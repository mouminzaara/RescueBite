<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EBDD" />
      <stop offset="50%" stop-color="#EAD9C4" />
      <stop offset="100%" stop-color="#DEC4A9" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#285C46" />
      <stop offset="100%" stop-color="#1E4736" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDE8D8" />
      <stop offset="100%" stop-color="#B8D1C3" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1C2A23" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Organic decorative backdrop shapes -->
  <circle cx="120" cy="100" r="140" fill="#FAF4EB" opacity="0.45" />
  <circle cx="720" cy="400" r="180" fill="#FAF4EB" opacity="0.35" />
  <circle cx="680" cy="80" r="90" fill="#DDE8D8" opacity="0.4" />
  <circle cx="90" cy="420" r="110" fill="#DDE8D8" opacity="0.3" />

  <!-- Center Card Illustration -->
  <g transform="translate(400, 230)" filter="url(#softShadow)">
    <!-- Plate base -->
    <ellipse cx="0" cy="30" rx="160" ry="24" fill="#1C2A23" opacity="0.08" />
    <circle cx="0" cy="0" r="100" fill="#FAF4EB" stroke="#DEC4A9" stroke-width="2" />
    <circle cx="0" cy="0" r="82" fill="url(#badgeGrad)" />

    <!-- Cloche / Chef Dome / Food Art -->
    <path d="M -45 10 C -45 -35, 45 -35, 45 10 Z" fill="#FAF4EB" opacity="0.95" />
    <ellipse cx="0" cy="10" rx="50" ry="7" fill="#FAF4EB" opacity="0.95" />
    <!-- Handle -->
    <circle cx="0" cy="-40" r="7" fill="#FAF4EB" />
    <rect x="-3" y="-35" width="6" height="8" rx="2" fill="#FAF4EB" />

    <!-- Sustainable Leaf Accent -->
    <path d="M 0 10 C 12 -2 24 10 24 10 C 24 10 12 22 0 10 Z" fill="#78977D" opacity="0.9" />
    <path d="M 0 10 C -12 -2 -24 10 -24 10 C -24 10 -12 22 0 10 Z" fill="#B8D1C3" opacity="0.9" />
    <!-- Fork & Spoon Minimal Flourish -->
    <circle cx="0" cy="10" r="4" fill="#285C46" />
  </g>

  <!-- Title Pill Badge -->
  <g transform="translate(400, 375)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1E4736" opacity="0.95" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">RESCUEBITE PARTNER</text>
  </g>

  <g transform="translate(400, 420)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#5C6A62" text-anchor="middle" letter-spacing="0.5">Eco-Conscious Kitchen · Fresh Surplus</text>
  </g>
</svg>
